name: Bug Report
description: Report a bug or issue with OakMobDrops
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Run command '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe what should have happened
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Describe what actually happened
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server Version
      description: Output of `/version` command
      placeholder: e.g., Paper version git-Paper-123 (MC 1.21.1)
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin Version
      description: Output of `/version OakMobDrops` command
      placeholder: e.g., OakMobDrops v1.0.0
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java Version
      description: Output of `java -version` command
      placeholder: e.g., Java 21.0.1
    validations:
      required: true

  - type: textarea
    id: other-plugins
    attributes:
      label: Other Relevant Plugins
      description: List any item backend plugins or other relevant plugins
      placeholder: |
        - ExecutableItems v5.0.0
        - ItemsAdder v3.0.0
        - Nexo v1.0.0
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Relevant Configuration
      description: Paste the relevant parts of your config.yml
      render: yaml
      placeholder: |
        mobs:
          ZOMBIE:
            enabled: true
            # ... rest of config
    validations:
      required: false

  - type: textarea
    id: error-log
    attributes:
      label: Error Log
      description: Paste any error messages from console or logs
      render: shell
      placeholder: Paste error logs here
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: Add any other context here
    validations:
      required: false
