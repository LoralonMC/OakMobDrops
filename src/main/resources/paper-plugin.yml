name: OakMobDrops
version: '${version}'
main: dev.oakheart.oakmobdrops.OakMobDrops
description: 'Advanced mob drop system with multi-backend support and statistics.'
api-version: '1.21.10'
authors:
  - Loralon
website: https://github.com/LoralonMC/OakMobDrops
dependencies:
  server:
    ExecutableItems:
      load: BEFORE
      required: false
    ItemsAdder:
      load: BEFORE
      required: false
    Nexo:
      load: BEFORE
      required: false
    OakPets:
      load: BEFORE
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false
permissions:
  oakmobdrops.*:
    description: 'Grants all OakMobDrops permissions'
    default: op
    children:
      oakmobdrops.use: true
      oakmobdrops.reload: true
      oakmobdrops.stats: true
      oakmobdrops.test: true
      oakmobdrops.list: true
      oakmobdrops.clearstats: true
      oakmobdrops.migrate: true
  oakmobdrops.use:
    description: 'Allows use of the base OakMobDrops command'
    default: op
  oakmobdrops.reload:
    description: 'Reload configuration'
    default: op
  oakmobdrops.stats:
    description: 'View drop statistics'
    default: op
  oakmobdrops.test:
    description: 'Test drops without killing mobs'
    default: op
  oakmobdrops.list:
    description: 'List configured mob drops'
    default: op
  oakmobdrops.clearstats:
    description: 'Clear all statistics data'
    default: op
  oakmobdrops.migrate:
    description: 'Migrate statistics between storage types'
    default: op
